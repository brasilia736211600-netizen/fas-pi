name: FAS E2E Live

on:
  push:
    branches:
      - fas-e2e-live
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fixture:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pytest
        run: python -m pip install --upgrade pytest
      - name: Run live fixture
        working-directory: e2e
        run: python -m pytest -q
